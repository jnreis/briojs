name: Website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'src/**'
      - 'scripts/build.js'
      - 'vite.config.*'
      - 'tsconfig.json'
      - 'tests/apps/**'
      - 'tests/site/**'
      - 'tests/site-content.test.js'
      - 'DOCUMENTATION.md'
      - 'CHANGELOG.md'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/site.yml'
  # Every PR runs the build so it can be a required check.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Website build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # ubuntu-latest already has Chromium's system libraries. Skipping
      # --with-deps avoids the Ubuntu mirror, which sometimes takes 10+ minutes.
      - run: pnpm exec playwright install chromium
      - run: pnpm run site:build
      - run: node --test tests/site-content.test.js
      - run: node site/scripts/check.mjs
      - run: pnpm run test:site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
