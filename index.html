<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brio.js vNext playground</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; margin: 2rem auto; max-width: 48rem; padding: 0 1rem; }
    section { border: 1px solid #ddd; border-radius: .75rem; margin: 1rem 0; padding: 1rem; }
    nav { display: flex; gap: 1rem; }
  </style>
</head>
<body>
  <h1>Brio.js vNext</h1>
  <section id="widget">
    <h2>Embeddable widget</h2>
    <label>Message <input b-model="message"></label>
    <p data-testid="message" b-text="message"></p>
    <button data-testid="increment" b-on-click="count++">Increment</button>
    <span data-testid="count" b-text="count"></span>
    <button data-testid="toggle" b-on-click="visible = !visible">Toggle details</button>
    <p data-testid="details" b-if="visible">Conditional content is mounted and disposed.</p>
    <ul>
      <li b-for="item in items" b-key="item.id" b-text="item.label"></li>
    </ul>
    <button data-testid="add-item" b-on-click="items.push({ id: items.length + 1, label: 'A new row' })">Add row</button>
    <click-counter label="Component"></click-counter>
  </section>
  <section id="spa">
    <h2>Optional single-page routing</h2>
    <nav><a href="/">Home route</a><a href="/about">About route</a></nav>
    <div b-router-outlet></div>
  </section>
  <script type="module" src="/examples/vnext.js"></script>
</body>
</html>
