    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #eceff3;
      }

      .items-wrapper {
        display: grid;
        width: 400px;
        gap: 10px;
        background: #9b95d9;
        padding: 10px;
      }

      .items {
        padding: 0 10px;
        background-color: #eceff3;
      }
    </style>

  <body>

    <!-- Syntax option 2 -->
    <div scope="{
      count: 0, 
      first: 'John', 
      last: 'Doe', 
      value: 'abc', 
      checked: true, 
      vehicle: ['Car'], 
      pick: 'one', 
      increment: e => {
        count++;
      },
      double: () => {
        return count * 2;
      },
      isOpen: false,
      toggle: () => {
        isOpen = !isOpen;
      },
      item: '',
      items: [{value: 'a'}, {value: 'b'}, {value: 'c'}],
      obj: { a: 1, b: 2, c: 3 },
    }">
      <p>Hello, ${ first } ${ last }!</p>

      <!-- Just object key -->
      <div class="items-wrapper">
        <div class="items" each="item2, index in items">
          <p>${ item2.value }</p>
          <input type="text" model="items[index].value">
          <button on-click="items.splice(index, 1)">Remove</button>
        </div>
      </div>

      <!-- Add new item to items -->
      <input type="text" model="item" style="margin-top: 10px;">
      <button on-click="items.push({value: item}); item = '';">Add</button>
