<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>b-for</title>
</head>
<body>
    <h1>b-for</h1>

    <script b-script>
        () => {
            $data.states = {
                1: 'Florida',
                2: 'Texas',
                3: 'Michigan'
            }
            $data.counties = {
                1: { 1: 'Miami-Dade', 2: 'Broward', 3: 'Palm Beach' },
                2: { 1: 'Harris', 2: 'Dallas', 3: 'Tarrant' },
                3: { 1: 'Wayne', 2: 'Oakland', 3: 'Macomb' }
            }
            $data.selected = {
                1: {},
                2: {},
                3: {}
            }
            console.log('DATA:', $data);
        }
    </script>

    <div>
        <div b-for="stateName, stateId in states">
            <h2 style="display: inline-block;">${ stateName }</h2>
            <span b-for="countyName, countyId in $data.counties[$for.stateId]">
                ${ countyName },
            </span>
            <div>
                Selected counties:
                <pre>${ JSON.stringify($data.selected[$for.stateId]) }</pre>
            </div>
        </div>
    </div>

    <script type="module" src="/src/briojs.min.ts"></script>

    <script>
        window.addEventListener('brio', () => {
            let {gc: {$hydrate} = brio.newApp();
            $hydrate('body');
        });
    </script>
</body>
</html>
