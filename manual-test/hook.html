<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hook</title>
</head>
<body b-data="{hook: [1,2,3], input: '123', handleHover(event) { console.log('Hovered!', event) } }">

    <!-- 
        !!! HOOKS ARE DEPRECATED !!!

        General notes about hooks:
        - Hooks are functions that run before or after the primary function of a directive.
        - Hooks with the highest priority run first.
        - Hooks with the same priority run in the order they were added.
        - The primary function of a directive is a hook with a priority of 0.
        - The first hook to run must expose any necessary reactive dependencies before any asynchronous operation.

        Directives with hooks that have reactive dependencies:
        - text node that interpolates reactive values
        - b-bind | bind
        - b-effect
        - b-html
        - b-if
        - b-model
        - b-show
        - b-teleport
        Notes:
        - The hook with the highest priority will run first and must expose the reactive dependencies before any asynchronous operation.
        - By default, the directive's hook is the only hook and must expose the reactive dependencies in its expression.
        - Hooks with priority less than 0 do not need to expose any reactive dependencies.

        Directives with hooks that have DOM event listeners:
        - b-boost
        - b-intersection: on-enter, on-exit
        - b-mask
        - b-model
        - b-on-[event] | on-[event]
        - b-resize

        Directives with hooks that only run once:
        - b-props
        - b-data
        - b-ref
        - b-script
        - b-style
        - b-template
        - b-id

        Directives that don't have hooks:
        - b-ignore
        - b-options
        - b-transition
     -->

    <h1 b-ref="h1" bind-hook="$data.hook" b-options="{'bind-hook': {prop:'bindHook'} }"></h1>

    <input id="input" type="text" b-model="$data.input">

    <button b-ref="click" on-click="$data.hook.push($data.input)">Add</button>
    <button on-click="$data.hook.pop()">Remove Last</button>

    <div b-ref="each" b-for="n in $data.hook">
        Number is {{ $for.n }}
        <input type="text" b-model="$for.n">
    </div>

    <div 
        on-resize="console.log('$size:', $size)" 
        b-options="{
            'on-resize': {box: 'border-box', document: true}
        }"
        style="resize: both; overflow: auto; width: 100px; height: 100px; border: 1px solid black;"
    >
        Resize me
    </div>

    <div  on-resize="console.log('Element resized', $size)"
  style="width: 200px; height: 100px; border: 3px solid black; margin: 50px; padding: 10px; resize: both; overflow: auto;"
>
  Resize this element to see the new size in the console.
</div>

    <div
        on-enter="console.log('on-enter', $entry)"
        b-options="{
            'on-enter': {threshold: 1, debounce: 1000, once: true}
        }"
        style="height: 100px; border: 1px solid black; margin: 50px; padding: 10px;"
    >
        Intersection
    </div>

    <div
        on-exit="console.log('on-exit', $entry)"
        b-options="{
            'on-exit': {threshold: 1, debounce: 1000, once: true}
        }"
        style="height: 100px; border: 1px solid black; margin: 50px; padding: 10px;"
    >
        Intersection
    </div>


<!-- Listening to a click event using inline code -->
<div on-click="console.log('Element clicked', $event)">
  Click this element to see the event object in the console.
</div>

<!-- Listening to a click event using a function stored in $data -->
<div
  b-data="{
    handleClick(event) {
      console.log('handleClick:', event);
    }
  }"
  on-click="handleClick">
  Hover over this element to trigger the hover event.
</div>

<!-- Using b-effect to run a side effect whenever a reactive value changes -->
<div b-data="{ count: 0, handleEffect() { console.log('The count is now', $data.count); } }" b-effect="handleEffect">
  <button on-click="count++">Increment</button>
  <button on-click="count--">Decrement</button>
  <p>Count: {{ count }}</p>
</div>

<input type="text" on-keyup="console.log('Shift + Enter key pressed', $event)" b-options="{'on-keyup': {keys: ['shift', 'enter']} }">

    <script type="module" src="/src/briojs.min.ts"></script>

    <script>
        window.addEventListener('brio', () => {
            let app = brio.newApp();
            let {$hydrate, $state, $effect, $watch} = app.gc;
            $hydrate('body');
        });
    </script>
</body>
</html>
