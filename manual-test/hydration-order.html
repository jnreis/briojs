<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script b-script>
        async () => {
            $data.name = 'Awesome Brio.js';

            // Simulate a delay to demonstrate hydration
            await new Promise(resolve => setTimeout(resolve, 1000));

            $data.name = 'Brio.js is awesome!';
        }
    </script>

    <template b-template b-if="name" b-props="{p1: 'Property 1', p2: 'Property 2'}" b-data="{name: 'Brio.js'}" b-for="i in [1,2,3]">
        <p b-text="`Hello, ${name}! This is item #${i}.`"></p>
        <p b-text="`Props: ${p1}, ${p2}`"></p>
    </template>
    <input type="text" b-model="name" />

    <!-- This b-effect will only log the name after the script has run -->
    <div b-effect="console.log('name:', name)"></div>

    <script type="module" src="/src/briojs.min.ts"></script>
    <script>
        window.addEventListener('brio', () => {
            let {gc} = brio.newApp();
            gc.$hydrate('body');
        });
    </script>
</body>
</html>
