<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hook</title>
</head>
<body b-data="{
    name: 'John', 
    age: 35, 
    email: 'john@doe.com',
    m1() {
        console.warn('Hello from m1!');
    }
}">

    <h1>
        Hi, ${ $data.name.toUpperCase() }! You are ${ $data.age + $data.age } years old and your email is ${ $data.email.toLowerCase() }.
    </h1>

    <script b-script b-effect="m1">
        (ctx) => {
            console.log('Hello from the script tag!', ctx);
        }
    </script>

    <script type="module" src="/src/briojs.min.ts"></script>

    <script>
        window.addEventListener('brio', () => {
            let app = brio.newApp();
            let {$hydrate, $state, $effect, $watch} = app.gc;
            $hydrate('body');
            console.log('app hydrated', app);
        });
    </script>
</body>
</html>
