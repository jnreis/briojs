<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body b-props="main">
    <h1>b-transition</h1>
    <p>This page demonstrates the use of b-transition with CSS transitions.</p>

    <div b-ref="text" b-show="show" b-transition="[['in-position', 'in-transition'],['in-position', 'out-transition']]">This will be animated</div>

    <button on-click="show = true">Show</button>
    <button on-click="show = false">Hide</button>

    <script type="module" src="/src/briojs.min.ts"></script>
    <script>
        window.addEventListener('brio', () => {
            let {gc: {$hydrate, $set} = brio.newApp();
            $set.props('main', () => ({
                show: true
            }));
            $hydrate('body');
        });
    </script>
    <style>
        .in-position {
            opacity: 0;
            transform: scale(.95);
        }
        .in-transition {
            transition: transform .2s ease-in-out;
        }
        .out-position {
            opacity: 1;
            transform: scale(1);
        }
        .out-transition {
            transition: opacity 2.1s, transform 2.1s;
        }
    </style>
</body>
</html>
