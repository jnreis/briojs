<template id="brio-dialog-template">
  <section class="part-root" b-id="['dialogTitle']"
    b-bind-style="{ '--part-accent': $props.accent || null }">
    <style>
      @scope {
        :scope { display: block; font: 15px/1.65 system-ui, sans-serif; color: light-dark(#152139, #edf3ff); }
        * { box-sizing: border-box; }
        h2 { margin: 0 0 12px; font-size: 1.5rem; line-height: 1.3; letter-spacing: -.035em; }
        p { margin: 0 0 16px; }
        button, input { font: inherit; color: inherit; }
        button { cursor: pointer; background: transparent; border: 1px solid light-dark(#d5e0ef, #344863); border-radius: 7px; padding: 8px 14px; }
        :focus-visible { outline: 3px solid var(--part-accent, light-dark(#245fe2, #9bc1ff)); outline-offset: 3px; }
        dialog { width: min(460px, calc(100% - 32px)); max-height: calc(100% - 32px); overflow: auto; padding: 24px; background: light-dark(#fff, #111e32); color: inherit; border: 1px solid light-dark(#d5e0ef, #344863); border-radius: 12px; }
        dialog::backdrop { background: #071427a6; }
        label { display: grid; gap: 6px; }
        input { width: 100%; padding: 8px 10px; background: transparent; border: 1px solid light-dark(#d5e0ef, #344863); border-radius: 6px; }
        .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
        .primary { background: var(--part-accent, light-dark(#245fe2, #9bc1ff)); color: light-dark(#fff, #111e32); }
      }
    </style>
    <dialog b-ref="dialog" b-bind-aria-labelledby="$id.dialogTitle"
      b-on-cancel="$data.onCancel($event)" b-on-close="$data.onClose()">
      <h2 b-bind-id="$id.dialogTitle"><slot name="title"><span b-text="$props.title"></span></slot></h2>
      <slot></slot>
      <slot name="footer">
        <div class="actions">
          <button type="button" b-on-click="$data.requestClose()" b-text="$props['close-label']"></button>
        </div>
      </slot>
    </dialog>
  </section>
</template>
