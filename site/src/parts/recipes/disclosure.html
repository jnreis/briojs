<template id="brio-disclosure-template">
  <section class="part-root" b-id="['title']" b-bind-aria-labelledby="$id.title"
    b-bind-style="{ '--part-accent': $props.accent || null }">
    <style>
      @scope {
        :scope { display: block; font: 15px/1.65 system-ui, sans-serif; color: light-dark(#152139, #edf3ff); }
        * { box-sizing: border-box; }
        h2 { margin: 0 0 12px; font-size: 1.5rem; line-height: 1.3; letter-spacing: -.035em; }
        p { margin: 12px 0; }
        .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-block: 18px; }
        button { cursor: pointer; font: inherit; color: inherit; background: transparent; border: 1px solid light-dark(#d5e0ef, #344863); border-radius: 7px; padding: 8px 14px; }
        :focus-visible { outline: 3px solid var(--part-accent, light-dark(#245fe2, #9bc1ff)); outline-offset: 3px; }
        [role="status"] { font-size: .85rem; }
        details { border-bottom: 1px solid light-dark(#d5e0ef, #344863); padding: 14px 0; }
        summary { cursor: pointer; font-weight: 650; }
      }
    </style>
    <h2 b-bind-id="$id.title" b-text="$props.title || $data.content.title"></h2>
    <p b-text="$data.content.description"></p>
    <div class="actions">
      <button type="button" b-on-click="$data.setAll(true)" b-text="$data.content.expandLabel"></button>
      <button type="button" b-on-click="$data.setAll(false)" b-text="$data.content.collapseLabel"></button>
      <span role="status" b-text="$data.status"></span>
    </div>
    <div b-on-toggle.capture="$data.sync()">
      <details b-for="item in $data.content.items" b-key="$for.item.id"
        b-bind-data-item-id="$for.item.id" b-bind-open="$data.isOpen($for.item.id)">
        <summary b-text="$for.item.label"></summary>
        <slot b-slot="{ item: $for.item }"><p b-text="$for.item.body"></p></slot>
      </details>
    </div>
  </section>
</template>
