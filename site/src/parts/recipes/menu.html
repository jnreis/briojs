<template id="brio-menu-template">
  <section class="part-root" b-id="['title', 'trigger', 'menu']" b-bind-aria-labelledby="$id.title"
    b-bind-style="{ '--part-accent': $props.accent || null }"
    b-on-click.outside="$data.close(false)" b-on-focusout="$data.onFocusOut($event)" b-on-keydown="$data.onKey($event)">
    <style>
      @scope {
        :scope { display: block; font: 15px/1.65 system-ui, sans-serif; color: light-dark(#152139, #edf3ff); }
        * { box-sizing: border-box; }
        h2 { margin: 0 0 12px; font-size: 1.5rem; line-height: 1.3; letter-spacing: -.035em; }
        p { margin: 0 0 16px; }
        [hidden] { display: none !important; }
        button { cursor: pointer; font: inherit; color: inherit; background: transparent; border: 1px solid light-dark(#d5e0ef, #344863); border-radius: 7px; padding: 8px 14px; }
        button:hover, .is-open { background: light-dark(#eef5ff, #1b3251); }
        :focus-visible { outline: 3px solid var(--part-accent, light-dark(#245fe2, #9bc1ff)); outline-offset: 3px; }
        a { color: var(--part-accent, light-dark(#245fe2, #9bc1ff)); }
        .menu-anchor { position: relative; margin-bottom: 18px; }
        [role="menu"] { position: absolute; top: calc(100% + 8px); left: 0; width: min(220px, 100%); z-index: 1; padding: 6px; background: light-dark(#fff, #111e32); border: 1px solid light-dark(#d5e0ef, #344863); border-radius: 9px; box-shadow: 0 8px 24px #0002; }
        [role="menuitem"] { display: block; width: 100%; text-align: left; border: 0; }
      }
    </style>
    <h2 tabindex="-1" b-bind-id="$id.title" b-text="$props.title || $data.content.title"></h2>
    <p b-text="$data.content.description"></p>
    <div class="menu-anchor">
      <button type="button" data-trigger b-bind-id="$id.trigger" aria-haspopup="menu"
        b-bind-aria-controls="$id.menu" b-bind-aria-expanded="$data.opened"
        b-bind-class="{ 'is-open': $data.opened }"
        b-on-click="$data.toggle()" b-on-keydown="$data.triggerKey($event)">
        <slot name="trigger"><span b-text="$data.content.triggerLabel"></span></slot>
      </button>
      <div role="menu" b-bind-id="$id.menu" b-bind-aria-labelledby="$id.trigger" hidden b-bind-hidden="!$data.opened">
        <button type="button" role="menuitem" tabindex="-1" b-for="item in $data.content.items" b-key="$for.item.id"
          b-on-click="$data.choose($for.item)" b-text="$for.item.label"></button>
      </div>
    </div>
    <p role="status" b-text="$data.content.message"></p>
    <a b-bind-href="'#' + $id.title" b-on-click.prevent="$data.backToHeading()" b-text="$data.content.backLabel"></a>
  </section>
</template>
