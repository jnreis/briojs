<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>b-html</title>
    <script src="https://cdn.jsdelivr.net/npm/@unocss/runtime"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@unocss/reset/tailwind.min.css">
</head>
<body class="flex flex-col justify-center h-screen max-w-screen-sm mx-auto">
    
    <div b-init="$hook($el, 'b-effect', ([call]) => console.warn('before-b-effect', componentName), -1);
        $hook($el, 'b-effect', ([call]) => console.warn('before-b-effect 444', componentName),1);"
        b-effect="console.log('Effect hydrated', componentName)" class="text-center" b-props="{
        componentName: 'c1',
        toggleComponent() {
            this.componentName = this.componentName == 'c1' ? 'c2' : 'c1';
        },
    }">
        <h1 class="text-4xl mb-2">b-html</h1>
        <h3 class="mb-6">The current component is: {{componentName}}</h3>
        <div class="mb-6" b-html="componentName"></div>

        <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded" on-click="toggleComponent">Change component</button>
    </div>

    <script>
        document.addEventListener('brio:init', () => {
            Brio.addComponent('c1',
                '<div class="p-2 bg-red">',
                '<p class="text-white">Component 1</p>',
                '<input b-props="{name: `Some value`}" type="text" b-model="name">',
                '</div>',
            );
            Brio.addComponent('c2',
                '<p class="text-white p-2 bg-blue">Component 2</p>',
            );
        })
    </script>

    <script type="module" src="/src/cdn.ts"></script>

    <style>
    </style>
</body>
</html>
