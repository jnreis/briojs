<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>b-if</title>
</head>
<body>
    <h1>b-if</h1>

    <div b-props="{ show: true }">
        <p b-if="show">Toggle this paragraph</p>
        <button on-click="show = !show">{{ show ? 'Remove' : 'Add' }}</button>
    </div>

    <script type="module" src="/src/cdn.ts"></script>
</body>
</html>
