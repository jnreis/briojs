        <style>
            .button {
                background-color: #007bff;
                padding: 0.5rem 1rem;
                border: none;
                color: white;
                cursor: pointer;
                border-radius: 4px;
                font-size: 1rem;
            }
            .button-in-start {
                background: blue;
                transform: translateX(300px) !important;
                transition: transform 2s ease-in-out, background 2.5s ease !important;
            }
            .button-out-start {
                transform: translate(70px, 250px) scale(0.5) !important;
                transition: transform 1s ease-in-out !important;
            }

            .square {
                width: 100px;
                height: 100px;
                background-color: coral;
                margin-bottom: 1rem;
                transition: all .3s linear;
            }

            .mb-1 {
                margin-bottom: 8px;
            }
        </style>

        <script type="module" src="/src/briojs.min.ts"></script>

        <style b-save="bg-light-gray">
            & {
                background-color: lightgray;
                padding: 1rem;
            }
        </style>

        <script>
            window.addEventListener('brio', () => {
                let app = brio.newApp();
                let {$dom, $state, $effect, $watch} = app.gc;
                $dom.hydrate('body');
            });
        </script>
