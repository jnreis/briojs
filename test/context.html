        <!-- <input id="input" type="text" b-model="level1" class="mb-1"> -->

        <div b-ref="square" b-show="level1" class="square" b-transition="[{
                background: 'blue',
                transform: 'translateX(300px)',
                transition: 'transform 2s ease-in-out, background 2.5s ease'
            }, {
                transform: 'translate(70px, 250px) scale(0.5)',
                transition: 'transform 1s ease-in-out'
            }]"></div>

        <button class="button" on-click="level1 = !level1">Toggle Level 1 (b-if)</button>

        <!-- <div b-if="level1" class="b-for" b-data="{dshow: true, items: [4, 5] }" b-for="n in items">
            {{n}}
        </div> -->

        <style>
            .button {
                background-color: #007bff;
                padding: 0.5rem 1rem;
                border: none;
                color: white;
                cursor: pointer;
                border-radius: 4px;
                font-size: 1rem;
            }
            .button-in-start {
                background: blue;
                transform: translateX(300px) !important;
                transition: transform 2s ease-in-out, background 2.5s ease !important;
            }
            .button-out-start {
                transform: translate(70px, 250px) scale(0.5) !important;
                transition: transform 1s ease-in-out !important;
            }

            .square {
                width: 100px;
                height: 100px;
                background-color: coral;
                margin-bottom: 1rem;
                transition: all .3s linear;
            }

            .mb-1 {
                margin-bottom: 8px;
            }
        </style>

        <script type="module" src="/src/briojs.min.ts"></script>

        <style b-save="bg-light-gray" b-data="{pd: '1rem'}">
            & {
                background-color: lightcyan;
                padding: {{pd}};
            }
        </style>

        <template b-template="my-template-2"></template>

        <div b-save="my-template-2" b-data="{field1: 'field from level 1', pd: '0.5rem', level1: level1}" b-id="['field1']">
            <strong>Inside template - level1: {{level1}}</strong>
            <br>
            <p>field1: {{field1}}</p>
            <input type="text" b-model="field1" class="mb-1">
        </div>
        <br>

        <script>
            window.addEventListener('brio', () => {
                let app = brio.newApp();
                console.log('App initialized', app);
                app.gc.$hydrate('body');
            });
        </script>
    </body>
</html>
