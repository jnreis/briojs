<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>b-html</title>
    <script src="https://cdn.jsdelivr.net/npm/@unocss/runtime"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@unocss/reset/tailwind.min.css">
</head>
<body class="flex flex-col justify-center h-screen max-w-screen-sm mx-auto">

    <div id="app" b-effect="console.log('Effect hydrated', $props.templateName)" 
        class="text-center" 
        b-props="{
            templateName: 'c1',
            toggleTemplate() {
                this.templateName = this.templateName == 'c1' ? 'c2' : 'c1';
            },
        }"
    >
        <h1 class="text-4xl mb-2">b-html</h1>
        <h3 class="mb-6">The current template is: {{ $props.templateName }}</h3>
        <div class="mb-6" b-html="$props.templateName"></div>

        <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded" on-click="$props.toggleTemplate">Change template</button>
    </div>

    <div id="builder" b-html-outer="c1"></div>

    <template b-template="c1">
        <div class="p-2 bg-red" b-props="{name: 'red'}">
            <p class="text-white">Template: {{ $props.name }}</p>
            <input type="text" b-model="$props.name">
        </div>
    </template>

    <template b-template="c2">
        <p class="text-white">Template 2</p>
    </template>

    <script type="module" src="/src/index.ts"></script>

    <script>
        window.addEventListener('brio', () => {
            let {$dom, $set} = brio.newApp();

            let c1 = $dom.query('[b-template="c1"]').innerHTML;
            let c2 = $dom.query('[b-template="c2"]').innerHTML;

            $set.template('c1', c1);
            $set.template('c2', c2);

            // $dom.queryAll('[b-template="c1"]').forEach($dom.hydrate);

            $dom.hydrate('#app');

            let builder = brio.newApp();

            builder.$set.template('c1', c1);
            builder.$dom.hydrate('#builder');
        })
    </script>
</body>
</html>
