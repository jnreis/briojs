<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>b-if</title>
        <style>
            .hide {
                display: block;
            }
        </style>
    </head>
    <body>

    <script b-script>
        () => {
            $data.if1 = true;
            $data.if2 = false;
        }
    </script>

    <template 
        b-template
        b-if="if1" 
        b-effect="console.log('1', $data.if1)"
    >
        <h2>b-if 1</h2>
        <div b-template b-if="if2" b-effect="console.log('2', $data.if2)">
            <h3>b-if 2</h3>
        </div>
    </template>
    <button on-click="$data.if1 = !$data.if1">Toggle If 1</button>
    <button on-click="$data.if2 = !$data.if2">Toggle If 2</button>

        <script type="module" src="/src/briojs.min.ts"></script>

        <script>
            window.addEventListener('brio', () => {
                let app = brio.newApp();
                let {$hydrate, $state, $effect, $watch} = app.gc;
                $hydrate('body');
            });
        </script>
    </body>
</html>
