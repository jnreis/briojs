    <script b-script>
        async () => {
            // Set reusable props
            $set.props('show', (ctx) => ({
                show: true, 
                show2: true,
                where: $refs.redBox,
                log() {
                    console.log('show $props', this);
                    console.log('show ctx item', ctx);
                }
            }));
            $set.data('show', (ctx) => ({ show: false, show2: false, 
                log() {
                    console.log('show $data', this);
                    console.log('show ctx item', ctx);
                }
            }));

            $data.theIf = true;
            $data.theShow = true;
        }
    </script>

    <template 
        b-template
        b-if="$data.theIf" 
        b-show="$data.theShow" 
        b-script="console.log('The template script')" 
        b-effect="console.log('Template', '\n', 'theIf:', $data.theIf, '\n', 'theShow:', $data.theShow)"
    >
        <div b-template b-if="$data.theShow" b-effect="console.log('H1', '\n', 'theIf:', $data.theIf, '\n', 'theShow:', $data.theShow)">
            <h1>b-if</h1>
            <p>This element is conditionally rendered based on the value of <code>theIf</code>.</p>
        </div>
    </template>
    <button b-ref="btn" on-click-prevent="$data.theIf = !$data.theIf">Toggle If</button>
    <button on-click="$data.theShow = !$data.theShow">Toggle Show</button>
