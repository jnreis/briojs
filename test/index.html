<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body b-hydrate>
	<script type="module" src="http://localhost:4321/src/pages/index.astro?astro&type=script&index=0&lang.ts"></script>

	<!-- Simple Counter -->
	<div b-script="c1">
		<h3 is:raw>Count: {{ $props.count }}</h3>
		<button on-click="$props.count++">Increment</button>
		<button on-click="$props.count--">Decrement</button>
	</div>

	<template is:raw>Count: {{ $props.count }}</template>

    <script b-ignore type="module" src="/src/index.ts"></script>
</body>
</html>
