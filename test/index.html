<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
	<!-- Simple Counter -->
	<div b-props="{count: 0}">
		<h3>Count: {{ $props.count }}</h3>
		<button on-click="$props.count++">Increment</button>
		<button on-click="$props.count--">Decrement</button>
	</div>

	<template>Count: {{ $props.count }}</template>

    <script b-ignore type="module" src="/src/briojs.min.ts"></script>

    <script>
        window.addEventListener('brio', () => {
            let app = brio.newApp();
            let {$hydrate} = app.gc;

            $hydrate('body');
        })
    </script>
</body>
</html>
