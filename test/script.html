<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body b-data>
    <script b-script b-effect="myEffect">
        async () => {
            console.log('Hello from b-script directive!', $data);

            $data.name = 'BrioJS';

            $data.getName = () => $data.name + ' is awesome!';

            $data.bindFn = ($initial) => `${$initial || 'Hi'}, ${$data.name}!`;

            $data.bindFn2 = $data.bindFn;

            $data.myEffect = () => {
                console.log('Effect ran! Name is:', $data.name);
            };

            $data.myData = () => {
                return {
                    age: 5
                }
            };

            // $data.htmlTemplate = `<h4>This is <strong>HTML </strong> content with name: {{name}}</h4>`;
            $set.template('htmlTemplate2', `<h2>This is <strong>HTML</strong> content with name: {{name}}</h2>`);

            $data.items = 2;

            $data.refName = 'inputName';

            $set.script('s2', ({$data}) => {
                console.log('$data from saved script s2:', $data);
            });

            $set.style('st2', `
                #something-else {
                    background-color: lightgray;
                }
            `);
        }
    </script>

    <style>
        h1 {
            color: blue;
        }
        .highlight {
            background-color: yellow;
        }
        #inputName {
            border: 2px solid green;
        }
        .something[data-active="true"] {
            font-weight: bold !important;
        }
    </style>

    <!-- Text Binding -->
    <h1 b-show="name" b-for="item, index in items">Item: {{ item }} - Index: {{ index }}</h1>

    <!-- Bind Directive -->
    <input type="text" bind-name bind-fn="$data.bindFn2" b-model="items" b-ref="inputName">

    <div b-data="myData" b-effect="console.warn('DIV $data', $data); $data.name = 'John'; "></div>

    <!-- HTML Directive -->
    <div b-html="htmlTemplate2"></div>
    <div b-template="htmlTemplate2"></div>

    <!-- ID Directive -->
    <div b-id="['hello', 'world']">
        hello: {{ $id.hello }} <br>
        world: {{ $id.world }}
    </div>

    <!-- Teleport Directive -->
    <div b-teleport="inputName">
        This content will be teleported to the body.
    </div>

    <!-- Script Directive -->
    <div b-script="['s1', 's2']"></div>

    <div b-style="['st1', 'st2']">STYLE</div>

    <script b-save="s1">
        async () => {
            console.log('$data from saved script s1:', $data);
        }
    </script>

    <style b-save="st1">
        .something {
            font-size: 20px;
            color: red;
        }
    </style>

    <script type="module" src="/src/briojs.min.ts"></script>
    <script>
        window.addEventListener('brio', () => {
            let app = brio.newApp('body');

            app.gc.$hydrate('body');

            console.log('app', app);
        })
    </script>
</body>
</html>
