<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>b-show</title>
        <style>
            .hide {
                display: block;
            }
            [b-if],[b-show] {
                display: none !important;
            }
            .in-position {
                opacity: 0 !important;
                transform: scale(.9) !important;
                transition: opacity .2s, transform .2s !important;
            }
            .in-transition {
                transition: opacity .2s, transform .2s !important;
            }
        </style>
    </head>
    <body>

    <script b-script>
        () => {
            $data.show1 = true;
            $data.show2 = false;
            $data.show3 = true;
        }
    </script>

    <div
        b-show="show1" 
        b-effect="console.log(1, $data.show1);"
        b-transition="[{
            opacity: 0, 
            transform: 'scale(0.9)', 
            transition: 'opacity 1.2s, transform 1.2s'
        }]"
    >
        <h2>b-show 1</h2>
        <div b-template b-show="show2" b-effect="console.log(2, $data.show2)">
            <h3>b-show 2</h3>
            <div b-template b-show="show3" b-effect="console.log(3, $data.show3)">
                <h4>b-show 3</h4>
            </div>
        </div>
    </div>
    <button on-click="$data.show1 = !$data.show1">Toggle show 1</button>
    <button on-click="$data.show2 = !$data.show2">Toggle show 2</button>
    <button on-click="$data.show3 = !$data.show3">Toggle show 3</button>

        <script type="module" src="/src/briojs.min.ts"></script>

        <script>
            window.addEventListener('brio', () => {
                let app = brio.newApp();
                let {$hydrate, $state, $effect, $watch} = app.gc;
                $hydrate('body');
            });
        </script>
    </body>
</html>
