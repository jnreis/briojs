<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter Example</title>
</head>
<body
    bind-id="$id.temp"
    b-id="['temp']"
    b-data="{
        h1Color: 'red',
        get isRed() {
            return this.h1Color == 'red'
        },
        onTextChange($mutations) {
            console.log('mutations:', $mutations)
        },
        options: {
            'on-removednodes': {
                subtree: true,
            }
        },
    }"
    hidden bind-hidden="false"
    b-effect="
    $set.route('/test/:slug', route => {
        console.log('custom route', route);
        $insert($http.get(`/test/${route.params.slug}`), 'outer', 'html');
    })"
>
    <h1 on-attrs="onTextChange($mutations)" b-options="options" bind-style="{color: h1Color}">Color is <div><span bind-style="{color: h1Color}" b-if="h1Color == 'red'">{{ h1Color }}</span></div></h1>

    <button on-click="h1Color = isRed ? 'green' : 'red'">
        Change color to {{ isRed ? 'green' : 'red' }}
    </button>

    <hr>

    <button on-click="$route('/test/load.html')" b-ref="globalButtonRef">
        Go to Load
    </button>

    <button on-click="$route('https://selectwebstudio.com')">
        Go to Select Web Studio
    </button>

    <div b-html="counter" b-data="{count: 100}"></div>

    <!-- <div b-props="{n: 30}" b-html="$http.get('/test/parts/counter.html')" id="counters"></div> -->

    <template b-save="counter" b-data="{count: 15}">

        <script b-script>
            async ({$store}) => {
                console.log(`$data:`, $data);
            }
        </script>

        <div b-style="['count']">
            <!-- A counter {{$data.count}} -->
            My count is {{ $data.count }}
            <button on-click="$data.count--">-</button>
            <button on-click="$data.count++">+</button>
        </div>

        <style b-save="count">
            & {
                margin: 1rem 0;
                padding: 10px;
                background-color: #f0f0f0;
            }
        </style>
    </template>

    <style>
        h1 {
            color: red;
        }
        p {
            color: blue;
        }
    </style>

    <script b-ignore type="module" src="/src/briojs.min.ts"></script>

    <script>
        window.addEventListener('brio', () => {
            let app = brio.newApp('body');

            app.gc.$hydrate('body');

            console.log('app', app);
        })
    </script>
</body>
</html>
