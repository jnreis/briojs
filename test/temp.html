<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter Example</title>
</head>
<body
    b-hydrate
    bind-id="$uid('temp')"
    b-uid="['temp']"
    b-data="{
        h1Color: 'red',
        get isRed() {
            return this.h1Color == 'red'
        },
    }"
    hidden bind-hidden="false"
    b-effect="
    $set.route('/test/:slug', route => {
        console.log('custom route', route);
        $dom.insert($http.get(`/test/${route.params.slug}`), 'outer', 'html');
    });
">
    <h1 bind-style="`color: {{$data.h1Color}};`">Heading 1 is red</h1>
    <h2>Heading 2 is green</h2>

    <h3>Change H1 color to: {{$data.isRed ? 'green' : 'red'}}</h3>
    <button on-click="$data.h1Color = $data.isRed ? 'green' : 'red'">
        Change H1 color
    </button>

    <hr>

    <button on-click="$dom.route('/test/load.html')" b-ref="globalButtonRef">
        Go to Load
    </button>

    <button on-click="$dom.route('https://selectwebstudio.com')">
        Go to Select Web Studio
    </button>

    <div b-html="counter"></div>

    <!-- <div b-props="{n: 30}" b-html="$http.get('/test/parts/counter.html')" id="counters"></div> -->

    <template b-save="counter">

        <script b-script>
            async ({$store}) => {
                $store.props.count = () => ({
                    count: 0
                });
                console.log(`props set to:`, $store);
            }
        </script>

        <div b-props="{count: 12}" b-css="['count']">
            <!-- A counter {{$props.count}} -->
            My count is {{ $props.count }}
            <button on-click="$props.count--">--</button>
            <button on-click="$props.count++">++</button>
        </div>

        <style b-css="count">
            & {
                margin: 1rem 0;
                padding: 10px;
                background-color: #f0f0f0;
            }
        </style>
    </template>

    <style>
        h1 {
            color: {{ $data.h1Color }}
        }
        p {
            color: blue;
        }
    </style>

    <script b-ignore b-load-once type="module" src="/src/cdn.ts"></script>
