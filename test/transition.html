<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .show-in {
            opacity: 0;
            transform: scale(0.8);
            transition: opacity 1s, transform 1s;
        }
        .show-out {
            opacity: 1;
            transform: translateY(50px);
            transition: opacity 1.5s, transform 1.5s;
        }
    </style>
</head>
<body b-props="{show: true}">
    <h1>b-transition</h1>
    <p>This page demonstrates the use of b-transition with GSAP animations.</p>

    <div b-if="show" b-transition="['.show-in', '.show-out']">This will be animated</div>

    <button on-click="show = true">Show</button>
    <button on-click="show = false">Hide</button>

    <script type="module" src="/src/briojs.min.ts"></script>
    <script>
        window.addEventListener('brio', () => {
            let {gc: {$hydrate}} = brio.newApp();
            $hydrate('body');
        });
    </script>
</body>
</html>
