<!DOCTYPE html>
<html lang="en">
<head>
    <script src="/site/public/theme.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manual Test: effect directive</title>
    <style>
        button { background: #3b82f6; color: white; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; margin-right: 6px; }
        code { background: var(--soft); padding: 2px 6px; border-radius: 4px; font-family: monospace; }
    </style>
    <link rel="stylesheet" href="/tests/shared/showcase.css">
    <link rel="icon" type="image/svg+xml" href="/site/public/favicon.svg">
</head>
<body b-data="{
    a: 5,
    b: 10,
    historyLogs: []
}">

    <h1>b-effect Directive Manual Tests</h1>
    <p>Tests reactive side effects executed in markup whenever their referenced reactive dependencies change.</p>

    <!-- Test 1: b-effect tracking -->
    <div class="card" b-effect="$data.historyLogs.push('Sum is ' + ($data.a + $data.b) + ' at ' + new Date().toLocaleTimeString())">
        <h3>1. Element-Level Reactive Effect</h3>
        <p>A: <strong>${$data.a}</strong> | B: <strong>${$data.b}</strong></p>
        <button b-on-click="$data.a++">Increment A</button>
        <button b-on-click="$data.b++">Increment B</button>

        <h4>Effect Execution Logs:</h4>
        <ul>
            <li b-for="log in $data.historyLogs"><code>${$for.log}</code></li>
        </ul>
    </div>

    <script src="/tests/source-viewer.js"></script>
    <script src="/dist/brio.min.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const app = brio.createApp();
            app.mount('body');
            console.log('effect.html hydrated successfully');
        });
    </script>
    <nav class="brio-demo-nav" b-ignore aria-label="Brio lab"><a href="/">Lab</a><a href="/tests/index.html">Experiments</a><button id="theme-toggle" type="button" aria-label="Switch color theme">&#9680;</button></nav>
</body>
</html>
