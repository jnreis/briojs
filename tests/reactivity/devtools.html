<!DOCTYPE html>
<html lang="en">
<head>
    <script src="/site/public/theme.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manual Test: Devtools Panel</title>
    <style>
        button { background: #3b82f6; color: white; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; margin-right: 6px; }
        button:hover { background: #2563eb; }
        #devtools-container pre { background: #0f172a; color: #38bdf8; padding: 16px; border-radius: 8px; font-family: monospace; font-size: 0.9rem; }
    </style>
    <link rel="stylesheet" href="/tests/shared/showcase.css">
    <link rel="icon" type="image/svg+xml" href="/site/public/favicon.svg">
</head>
<body>

    <h1>Devtools Panel Manual Tests</h1>
    <p>Tests the development inspector bridge, live app tracking, effect counting, and app state snapshots.</p>

    <div class="card" id="counter-app">
        <h3>Sample Counter App</h3>
        <p>Count: <strong b-text="$data.count"></strong></p>
        <button b-on-click="$data.count++">Increment Count</button>
        <button b-on-click="$data.count--">Decrement Count</button>
    </div>

    <div class="card">
        <h3>Live Brio Devtools Panel</h3>
        <div id="devtools-container"></div>
    </div>

    <script src="/tests/source-viewer.js"></script>
    <script src="/dist/brio.dev.min.js"></script>
    <script>

        // 1. Mount Devtools Inspector Panel
        const stopInspector = brio.devtoolsPanel(document.getElementById('devtools-container'));

        // 2. Mount App
        const app = brio.createApp({
            state: () => ({ count: 5 })
        });
        app.mount('#counter-app');
        window.addEventListener('pagehide', () => {
            stopInspector();
            app.dispose();
        }, { once: true });
    </script>
    <nav class="brio-demo-nav" b-ignore aria-label="Brio lab"><a href="/">Lab</a><a href="/tests/index.html">Experiments</a><button id="theme-toggle" type="button" aria-label="Switch color theme">&#9680;</button></nav>
</body>
</html>
